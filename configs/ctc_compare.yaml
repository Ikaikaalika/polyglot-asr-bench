# Tier B lab: CTC vs attention seq2seq on identical audio.
#
# Same clips, same scorer, two fundamentally different ways of handling the latent
# monotonic alignment. Run it, then read the JSONL side by side and look for:
#   - CTC: errors consistent with its conditional-independence assumption
#     (implausible letter sequences, no language-model-style self-correction)
#   - Whisper: fluent output that can hallucinate or loop on silence/noise
# Runs on CPU. See docs/LEARNING.md, Tier B.
results_dir: results
augmentations: ["none"]

models:
  - name: wav2vec2-base-960h-ctc
    backend: hf_ctc
    model_id: facebook/wav2vec2-base-960h
    device: cpu

  - name: faster-whisper-tiny-int8
    backend: faster_whisper
    model_size: tiny
    device: cpu
    compute_type: int8
    beam_size: 1

datasets:
  - name: librispeech-dummy-en
    kind: hf
    hf_id: hf-internal-testing/librispeech_asr_dummy
    config: clean
    split: validation
    text_key: text
    language: en
    whisper_lang: en
    max_samples: 10
