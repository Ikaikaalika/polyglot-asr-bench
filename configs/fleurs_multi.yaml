# Multilingual sweep — meant for a rented CUDA GPU.
# Scale `datasets` up to dozens of languages once the pipeline is happy.
# FLEURS config codes look like: en_us, es_419, fr_fr, de_de, hi_in, ar_eg,
# ja_jp, cmn_hans_cn, pt_br, ru_ru, tr_tr, vi_vn, sw_ke, yo_ng, ...
results_dir: results
augmentations: ["none", "telephony"]   # clean vs contact-center-style degradation

models:
  - name: faster-whisper-large-v3-fp16
    backend: faster_whisper
    model_size: large-v3
    device: cuda
    compute_type: float16
    beam_size: 1
  - name: faster-whisper-large-v3-int8      # quantization tradeoff vs the fp16 row
    backend: faster_whisper
    model_size: large-v3
    device: cuda
    compute_type: int8_float16
    beam_size: 1

datasets:
  - name: fleurs-en
    kind: hf
    hf_id: google/fleurs
    config: en_us
    split: test
    text_key: transcription
    language: en
    whisper_lang: en
    max_samples: 200
  - name: fleurs-es
    kind: hf
    hf_id: google/fleurs
    config: es_419
    split: test
    text_key: transcription
    language: es
    whisper_lang: es
    max_samples: 200
  - name: fleurs-hi
    kind: hf
    hf_id: google/fleurs
    config: hi_in
    split: test
    text_key: transcription
    language: hi
    whisper_lang: hi
    max_samples: 200
